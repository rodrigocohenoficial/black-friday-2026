<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Friday · Rodrigo Cohen</title>
  <meta name="description" content="A Black Friday do Rodrigo Cohen abre na live de lançamento.">
  <!-- Página provisória: fica fora do Google até o lançamento. Apague esta linha quando a página oficial subir. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --fundo: #0B0B0A;
      --texto: #F2EDE2;
      --dourado: #B0843B;
      --apagado: #8C877C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--fundo);
      color: var(--texto);
      font-family: "Inter", system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 560px; }
    .selo {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid var(--dourado);
      border-radius: 999px;
      color: var(--dourado);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 28px 0 16px;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(40px, 9vw, 72px);
      font-weight: 600;
      line-height: 1.05;
    }
    h1 span { color: var(--dourado); }
    p { font-size: 18px; line-height: 1.6; color: var(--apagado); }
    .data { margin-top: 28px; color: var(--texto); font-weight: 600; }
    footer { margin-top: 48px; font-size: 13px; color: var(--apagado); }
  </style>
</head>
<body>
  <main>
    <span class="selo">Em breve</span>
    <h1>Black Friday<br><span>Rodrigo Cohen</span></h1>
    <p>A maior condição do ano abre ao vivo, na live de lançamento.</p>
    <p class="data">19 de novembro</p>
    <footer>© 2026 Rodrigo Cohen</footer>
  </main>
</body>
</html>
